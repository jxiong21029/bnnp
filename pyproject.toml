[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "bnnp"
version = "0.2.0"
dependencies = [
    "numpy",
    "pydantic",
    "pytest",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
wandb = ["wandb"]

[tool.ruff]
line-length = 100
exclude = ["__pycache__"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bnnp*"]
namespaces = false
